name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    # 小丑鱼是 Windows 优先的桌面产品（本机 Edge 渲染、Windows 文件关联、盘符/UNC 路径），
    # 只跑 Linux 会把“Linux CI 通过”错当成“Windows 可用”。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      # 必须在 typecheck 之前：vendored 引擎的 dist 是主项目类型检查的依据，
      # 一旦漏提交，本机（有构建产物）会通过而 CI 报"找不到模块"。
      # git diff 检不出这种情况——被忽略且不存在的目录不会产生差异，
      # 所以这里直接确认它们已被 git 跟踪。
      - name: vendored 引擎产物已入库
        run: |
          git ls-files --error-unmatch examples/companion/vendor/docx-engine/dist/index.js > /dev/null
          git ls-files --error-unmatch examples/companion/vendor/pptx-engine/dist/index.js > /dev/null
        shell: bash
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # 文档核验此前只靠人工执行，红了一段时间没人发现，因此纳入 CI。
      # 它只做内容与链接检查，与操作系统无关，跑一次即可。
      - name: 文档核验
        if: runner.os == 'Linux'
        working-directory: .
        run: node scripts/verify-docs.mjs
      # vendored 引擎的 dist 入库，改了 src 不重建就会出现"跑的是旧代码"。
      # 只在 Linux 上比对：Windows runner 的 autocrlf 会把检出文件转成 CRLF，
      # 而 tsc 输出 LF，diff 会整片报差异。
      - name: vendored 引擎产物与源码同步
        if: runner.os == 'Linux'
        run: |
          npm run vendor:docx-engine
          npm run vendor:pptx-engine
          git diff --exit-code -- examples/companion/vendor
